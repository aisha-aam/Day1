<h1>Node.js Built-in Modules</h1>

<div class="container">

  <div class="card">
    <h2>FS</h2>
    <p>File exists: {{ data.file }}</p>
  </div>

  <div class="card">
    <h2>PATH</h2>
    <p>{{ data.path }}</p>
  </div>

  <div class="card">
    <h2>OS</h2>
    <p>Platform: {{ data.os }}</p>
    <p>CPU: {{ data.cpu }}</p>
    <p>Free Memory: {{ data.memory }}</p>
  </div>

  <div class="card">
    <h2>CRYPTO</h2>
    <p>{{ data.hash }}</p>
  </div>

</div>
