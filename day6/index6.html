<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-4">

        <!-- Add Product -->
        <div class="card mb-4">

            <div class="card-header">
                <h5 class="mb-0">Add Product</h5>
            </div>

            <div class="card-body">
                <form id="addProductForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Product Name</label>
                            <input
                                type="text"
                                id="productName"
                                class="form-control"
                                placeholder="Enter product name"
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <input
                                type="text"
                                id="productCategory"
                                class="form-control"
                                placeholder="Enter category"
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Price</label>
                            <input
                                type="number"
                                id="productPrice"
                                class="form-control"
                                min="0"
                                placeholder="Enter price"
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Quantity</label>
                            <input
                                type="number"
                                id="productQuantity"
                                class="form-control"
                                min="0"
                                placeholder="Enter quantity"
                            >
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-dark">
                                Add Product
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>


        <!-- Products -->
        <div class="card">
            <div class="card-header">
                <div class="row align-items-center g-2">

                    <div class="col-md-6">
                        <h5 class="mb-0">Products</h5>
                    </div>

                    <div class="col-md-6">
                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Search by name or category..."
                        >
                    </div>
                </div>
            </div>


            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="productsTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>


    <!-- Update Modal -->
    <div
        class="modal fade"
        id="updateModal"
        tabindex="-1"
        aria-hidden="true"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Update Product</h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>
                </div>


                <div class="modal-body">

                    <input type="hidden" id="updateId">

                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input
                            type="text"
                            id="updateName"
                            class="form-control"
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input
                            type="number"
                            id="updatePrice"
                            class="form-control"
                            min="0"
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <input
                            type="text"
                            id="updateCategory"
                            class="form-control"
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input
                            type="number"
                            id="updateQuantity"
                            class="form-control"
                            min="0"
                        >
                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="button"
                        class="btn btn-dark"
                        id="saveUpdateBtn"
                    >
                        Save Changes
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Delete Modal -->
    <div
        class="modal fade"
        id="deleteModal"
        tabindex="-1"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-sm">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Delete Product</h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>
                </div>

                <div class="modal-body">

                    <p class="mb-0">
                        Are you sure you want to delete
                        <strong id="deleteProductName"></strong>?
                    </p>

                    <input type="hidden" id="deleteId">

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="button"
                        class="btn btn-danger"
                        id="confirmDeleteBtn"
                    >
                        Delete
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="main.js"></script>

</body>
</html>
